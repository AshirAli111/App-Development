name: next_step_learning
description: "A professional AI-powered tutoring Flutter application."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # -------------------------
  # UI FONTS
  # -------------------------
  google_fonts: ^6.2.1

  # -------------------------
  # ICONS
  # -------------------------
  lucide_flutter: ^1.16.0
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  rive: ^0.13.4
  provider: ^6.1.5+1
  shared_preferences: ^2.5.4

  # -------------------------
  # ANIMATIONS
  # -------------------------
  lottie: ^3.1.2
  flutter_animate: ^4.5.0

  # -------------------------
  # STATE MANAGEMENT / ROUTING
  # -------------------------
  get: ^4.6.6

  # -------------------------
  # RESPONSIVENESS (no crash on any screen size)
  # -------------------------
  flutter_screenutil: ^5.9.0

  # -------------------------
  # IMAGES + CACHE
  # -------------------------
  cached_network_image: ^3.3.1

  # -------------------------
  # LOADING INDICATORS
  # -------------------------
  loading_animation_widget: ^1.2.0
  shimmer: ^3.0.0

  # -------------------------
  # PERMISSIONS / CAMERA
  # -------------------------
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  file_picker: ^10.3.7

  # -------------------------
  # UTILITY PACKAGES
  # -------------------------
  intl: ^0.19.0
  http: ^1.6.0
  webview_flutter: ^4.10.0
  url_launcher: ^6.2.5

  # -------------------------
  # VIDEO/VOICE CALLS
  # -------------------------
  jitsi_meet_flutter_sdk: ^12.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    # - assets/icons/
    # - assets/lottie/
    # - assets/illustrations/
